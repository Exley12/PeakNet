[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peaknet"
version = "0.1.1"
description = "1D spectral peak denoising network"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Exley12", email = "matthewaexley@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "onnxruntime",
]

[project.urls]
Repository = "https://github.com/Exley12/PeakNet"

[project.optional-dependencies]
dev = [
    "torch",
    "onnx",
    "onnxscript",
]

[tool.setuptools]
packages = ["peaknet"]

[tool.setuptools.package-dir]
"peaknet" = "peaknet_dev"

[tool.setuptools.package-data]
peaknet = ["*.onnx", "*.onnx.data"]
